services:
  - type: web
    name: suficiencia-escrita
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DOCENTE_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: evaluaciones
      mountPath: /var/data
      sizeGB: 1
